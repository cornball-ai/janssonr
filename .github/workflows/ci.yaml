name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  _R_CHECK_FORCE_SUGGESTS_: "false"

jobs:
  # vendor: '' legs install a system jansson and must link it; vendor: 1
  # legs strip any preinstalled jansson so configure's auto-fallback
  # compiles the bundled 2.15.1 — the macOS one reproduces CRAN's mac
  # builders, which carry no jansson at all.
  ci:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, backend: RAPT, vendor: ''}
          - {os: macos-latest,  backend: '',   vendor: ''}
          - {os: ubuntu-latest, backend: RAPT, vendor: '1'}
          - {os: macos-latest,  backend: '',   vendor: '1'}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - name: Install libjansson (Linux)
        if: runner.os == 'Linux' && matrix.vendor == ''
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends libjansson-dev

      - name: Install jansson (macOS)
        if: runner.os == 'macOS' && matrix.vendor == ''
        run: brew install jansson

      - name: Remove any preinstalled jansson (vendored leg)
        if: matrix.vendor != ''
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            sudo apt-get remove -y libjansson-dev libjansson4 2>/dev/null || true
          else
            brew uninstall --ignore-dependencies jansson 2>/dev/null || true
          fi

      - name: Setup r-ci
        uses: eddelbuettel/github-actions/r-ci@master
        with:
          backend: ${{ matrix.backend }}

      - name: Dependencies
        run: ./run.sh install_all

      - name: Assert runtime jansson matches compile-time
        run: |
          R CMD INSTALL .
          Rscript -e 'v <- janssonr:::jansson_version(); print(v); stopifnot(identical(v[["compiled"]], v[["runtime"]]))'

      # the .so's dynamic dependencies are the ground truth for which
      # linkage configure chose (version strings could coincide)
      - name: Assert linkage matches the leg
        run: |
          SO=$(Rscript -e 'cat(system.file("libs", paste0("janssonr", .Platform$dynlib.ext), package = "janssonr"))')
          # outside the package tree: R CMD check counts a stray file in
          # the source root as a non-standard top-level file
          deps="${RUNNER_TEMP:-/tmp}/deps.out"
          if [ "$RUNNER_OS" = Linux ]; then ldd "$SO" > "$deps"; else otool -L "$SO" > "$deps"; fi
          cat "$deps"
          # "libjansson", not "jansson": the .so's own name (janssonr.so)
          # appears in otool -L output and contains "jansson"
          if [ -n "${{ matrix.vendor }}" ]; then
            if grep -qi libjansson "$deps"; then echo "vendored leg linked a system jansson" >&2; exit 1; fi
            Rscript -e 'stopifnot(janssonr:::jansson_version()[["compiled"]] == "2.15.1")'
          else
            grep -qi libjansson "$deps"
          fi

      - name: Test
        run: ./run.sh run_tests

      # r-ci's run_tests does not fail on check WARNINGs. The 0.1.0
      # submission was rejected for warnings this workflow had already
      # printed and then reported success on, so gate on them here.
      - name: Fail on check WARNINGs
        run: |
          log=$(find . -name 00check.log -print -quit)
          if [ -z "$log" ]; then
            echo "no 00check.log found - the check did not run" >&2
            exit 1
          fi
          grep -E "^Status" "$log"
          # Any compiler or linker warning is a finding, with one
          # exception: the GitHub macOS runners carry libR and homebrew
          # dylibs built for a newer deployment target than R targets,
          # so every link there emits "ld: warning: building for
          # macOS-11.0, but linking with dylib ... built for newer
          # version". CRAN's macOS builders do not, and we cannot
          # rebuild the runner's dylibs. Nothing else is tolerated.
          if grep -E "warning:" "$log" | grep -qv "building for macOS"; then
            echo "unexpected compiler/linker warnings:" >&2
            grep -E "warning:" "$log" | grep -v "building for macOS" >&2
            exit 1
          fi
          # and no warning-level check. Two runner artifacts are excused,
          # each only when the thing that excuses it is actually present,
          # so these cannot quietly cover a real finding:
          other=$(grep -E "^\* checking .*\.\.\. (ERROR|WARNING)" "$log") || true
          #  - the install WARNING, when the tolerated ld noise triggered it
          if grep -q "building for macOS" "$log"; then
            other=$(echo "$other" | grep -v "can be installed") || true
          fi
          #  - top-level files, when its only complaint is that the macOS
          #    runners have no checkbashisms script (a stray file in the
          #    source root reports here too, and must still fail)
          if grep -q "needs the 'checkbashisms' script" "$log" &&
             ! grep -q "Non-standard file" "$log"; then
            other=$(echo "$other" | grep -v "top-level files") || true
          fi
          if [ -n "$other" ]; then
            echo "check reported:" >&2
            echo "$other" >&2
            grep -B2 -A8 -E "\.\.\. (ERROR|WARNING)" "$log" >&2
            exit 1
          fi

  # Exercise the Debian packaging and repository tooling: build the deb
  # inside the suite container (debhelper + lintian gate), index it with
  # mkrepo.sh, and prove the versioned r-base-core dependency resolves
  # and the installed package loads.
  deb:
    runs-on: ubuntu-latest
    container: rocker/r2u:noble
    steps:
      - uses: actions/checkout@v6

      - name: Build deb
        run: SUITE=noble SRC="$PWD" OUT="$PWD/dist-ci" tools/build-deb-inner.sh

      - name: Index repository
        run: |
          apt-get install -y --no-install-recommends apt-utils >/dev/null
          mkdir repo-ci && cp docs/repo.conf repo-ci/
          JANSSONR_REPO="$PWD/repo-ci" tools/mkrepo.sh noble dist-ci/*.deb

      # Install by NAME through the scratch repository, so resolution,
      # index checksums, and the pool layout are all on the tested path,
      # and assert the versioned r-base-core dependency matches the
      # build R rather than merely printing it.
      - name: Install from the scratch repository and load
        run: |
          printf 'Types: deb\nURIs: file://%s/repo-ci\nSuites: noble\nComponents: main\nTrusted: yes\nEnabled: yes\n' "$PWD" \
            > /etc/apt/sources.list.d/janssonr-ci.sources
          apt-get update -qq
          apt-get install -y r-cornball-janssonr
          want="r-base-core (>= $(Rscript -e 'cat(with(R.version, sprintf("%s.%s.0", major, sub("[.].*", "", minor))))'))"
          echo "expect: $want"
          dpkg -s r-cornball-janssonr | grep "^Depends:"
          dpkg -s r-cornball-janssonr | grep "^Depends:" | grep -qF "$want"
          Rscript -e 'library(janssonr); cat(to_json(list(ok = TRUE)), "\n")'

  # CRAN's Debian leg compiles the BUNDLED Jansson (its machines have no
  # system jansson) with a gcc newer than any distro we build on. Both
  # facts together hid the warnings that got 0.1.0 rejected, so mirror
  # that environment and fail on WARNINGs.
  cran:
    runs-on: ubuntu-latest
    container: rocker/r-devel:latest
    steps:
      - uses: actions/checkout@v6

      - name: as-cran check, bundled Jansson, newest gcc
        run: SRC="$PWD" bash tools/cran-check.sh

  # Prove the declared jansson >= 2.11 floor with the real 2.11 library:
  # mapping and ownership behavior, not just symbol existence.
  floor:
    runs-on: ubuntu-latest
    env:
      _R_CHECK_FORCE_SUGGESTS_: "false"
    steps:
      - uses: actions/checkout@v6

      - name: Build jansson 2.11 from source
        run: |
          curl -sSL -o jansson-2.11.tar.gz https://github.com/akheron/jansson/releases/download/v2.11/jansson-2.11.tar.gz
          tar xf jansson-2.11.tar.gz
          cd jansson-2.11
          ./configure --prefix="$HOME/jansson211"
          make -j2
          make install

      - name: Setup r-ci
        uses: eddelbuettel/github-actions/r-ci@master
        with:
          backend: RAPT

      - name: Dependencies
        run: ./run.sh install_all

      # r-ci's bootstrap occasionally degrades to Ubuntu's stock R when
      # the CRAN apt repo add hiccups; janssonr needs >= 4.4, so name
      # that failure here instead of burying it in the install step.
      - name: Assert modern R
        run: Rscript -e 'v <- getRversion(); cat("R", as.character(v), "\n"); stopifnot(v >= "4.4.0")'

      - name: Install against 2.11 and assert linkage
        run: |
          export PKG_CONFIG_PATH="$HOME/jansson211/lib/pkgconfig"
          export LD_LIBRARY_PATH="$HOME/jansson211/lib"
          R CMD INSTALL .
          SO=$(Rscript -e 'cat(system.file("libs", "janssonr.so", package = "janssonr"))')
          ldd "$SO" | tee ldd.out
          grep -q "$HOME/jansson211/lib/libjansson" ldd.out
          # headers were 2.11 (below 2.13.1), so the runtime probe must be NA
          Rscript -e 'v <- janssonr:::jansson_version(); print(v); stopifnot(v[["compiled"]] == "2.11", is.na(v[["runtime"]]))'

      - name: Test against 2.11
        run: |
          export LD_LIBRARY_PATH="$HOME/jansson211/lib"
          Rscript -e 'exit <- tinytest::test_package("janssonr", at_home = TRUE); if (any(!sapply(exit, isTRUE))) stop("test failures")'
