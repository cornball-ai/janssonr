name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  _R_CHECK_FORCE_SUGGESTS_: "false"

jobs:
  ci:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, backend: RAPT}
          - {os: macos-latest,  backend: ''}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - name: Install libjansson (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends libjansson-dev

      - name: Install jansson (macOS)
        if: runner.os == 'macOS'
        run: brew install jansson

      - name: Setup r-ci
        uses: eddelbuettel/github-actions/r-ci@master
        with:
          backend: ${{ matrix.backend }}

      - name: Dependencies
        run: ./run.sh install_all

      - name: Assert runtime jansson matches compile-time
        run: |
          R CMD INSTALL .
          Rscript -e 'v <- janssonr:::jansson_version(); print(v); stopifnot(identical(v[["compiled"]], v[["runtime"]]))'

      - name: Test
        run: ./run.sh run_tests

  # Exercise the Debian packaging and repository tooling: build the deb
  # inside the suite container (debhelper + lintian gate), index it with
  # mkrepo.sh, and prove the versioned r-base-core dependency resolves
  # and the installed package loads.
  deb:
    runs-on: ubuntu-latest
    container: rocker/r2u:noble
    steps:
      - uses: actions/checkout@v6

      - name: Build deb
        run: SUITE=noble SRC="$PWD" OUT="$PWD/dist-ci" tools/build-deb-inner.sh

      - name: Index repository
        run: |
          apt-get install -y --no-install-recommends apt-utils >/dev/null
          mkdir repo-ci && cp docs/repo.conf repo-ci/
          JANSSONR_REPO="$PWD/repo-ci" tools/mkrepo.sh noble dist-ci/*.deb

      # Install by NAME through the scratch repository, so resolution,
      # index checksums, and the pool layout are all on the tested path,
      # and assert the versioned r-base-core dependency matches the
      # build R rather than merely printing it.
      - name: Install from the scratch repository and load
        run: |
          printf 'Types: deb\nURIs: file://%s/repo-ci\nSuites: noble\nComponents: main\nTrusted: yes\nEnabled: yes\n' "$PWD" \
            > /etc/apt/sources.list.d/janssonr-ci.sources
          apt-get update -qq
          apt-get install -y r-cornball-janssonr
          want="r-base-core (>= $(Rscript -e 'cat(with(R.version, sprintf("%s.%s.0", major, sub("[.].*", "", minor))))'))"
          echo "expect: $want"
          dpkg -s r-cornball-janssonr | grep "^Depends:"
          dpkg -s r-cornball-janssonr | grep "^Depends:" | grep -qF "$want"
          Rscript -e 'library(janssonr); cat(to_json(list(ok = TRUE)), "\n")'

  # Prove the declared jansson >= 2.11 floor with the real 2.11 library:
  # mapping and ownership behavior, not just symbol existence.
  floor:
    runs-on: ubuntu-latest
    env:
      _R_CHECK_FORCE_SUGGESTS_: "false"
    steps:
      - uses: actions/checkout@v6

      - name: Build jansson 2.11 from source
        run: |
          curl -sSL -o jansson-2.11.tar.gz https://github.com/akheron/jansson/releases/download/v2.11/jansson-2.11.tar.gz
          tar xf jansson-2.11.tar.gz
          cd jansson-2.11
          ./configure --prefix="$HOME/jansson211"
          make -j2
          make install

      - name: Setup r-ci
        uses: eddelbuettel/github-actions/r-ci@master
        with:
          backend: RAPT

      - name: Dependencies
        run: ./run.sh install_all

      # r-ci's bootstrap occasionally degrades to Ubuntu's stock R when
      # the CRAN apt repo add hiccups; janssonr needs >= 4.4, so name
      # that failure here instead of burying it in the install step.
      - name: Assert modern R
        run: Rscript -e 'v <- getRversion(); cat("R", as.character(v), "\n"); stopifnot(v >= "4.4.0")'

      - name: Install against 2.11 and assert linkage
        run: |
          export PKG_CONFIG_PATH="$HOME/jansson211/lib/pkgconfig"
          export LD_LIBRARY_PATH="$HOME/jansson211/lib"
          R CMD INSTALL .
          SO=$(Rscript -e 'cat(system.file("libs", "janssonr.so", package = "janssonr"))')
          ldd "$SO" | tee ldd.out
          grep -q "$HOME/jansson211/lib/libjansson" ldd.out
          # headers were 2.11 (below 2.13.1), so the runtime probe must be NA
          Rscript -e 'v <- janssonr:::jansson_version(); print(v); stopifnot(v[["compiled"]] == "2.11", is.na(v[["runtime"]]))'

      - name: Test against 2.11
        run: |
          export LD_LIBRARY_PATH="$HOME/jansson211/lib"
          Rscript -e 'exit <- tinytest::test_package("janssonr", at_home = TRUE); if (any(!sapply(exit, isTRUE))) stop("test failures")'
